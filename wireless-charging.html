<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Powering Freedom with Wireless Energy</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #222;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        .text-content {
            flex: 1;
        }

        .text-content h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .text-content p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 500px;
        }

        .cta-btn {
            display: inline-block;
            padding: 14px 26px;
            background: #000;
            color: #fff;
            font-size: 16px;
            border-radius: 6px;
            text-decoration: none;
            transition: 0.2s ease-in-out;
        }

        .cta-btn:hover {
            background: #444;
        }

        .image-wrapper {
            flex: 1;
            text-align: center;
        }

        .image-wrapper img {
            width: 100%;
            max-width: 600px;
        }

        /* Mobile Responsive */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                text-align: center;
            }

            .text-content h1 {
                font-size: 34px;
            }

            .text-content p {
                margin-left: auto;
                margin-right: auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="text-content">
            <h1>Powering Freedom with Wireless Energy</h1>
            <p>
                Experience the next level of convenience with our wireless charging
                solution for hearing aids. No cables. No hassle. Just seamless
                power.
            </p>

            <a href="#" class="cta-btn">Learn More</a>
        </div>

        <div class="image-wrapper">
            <img src="Wireless_Energy.svg" alt="Wireless Charging Image">
        </div>
    </div>
</body>
</html>
