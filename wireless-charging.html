<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wireless Energy</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100%;
        }

        /* Hero section */
        .hero {
            width: 100%;
            min-height: 100vh; /* ensures it fills the viewport */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* fills container without stretching */
            display: block;
        }

        /* Optional text over hero */
        .hero-text {
            position: absolute;
            color: white;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }

        /* Scrollable content below hero */
        .content {
            padding: 40px 20px;
            background: #f5f5f5;
        }

        .content h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <div class="hero">
        <img src="Wireless_Energy.svg" alt="Wireless Charging Image">
        <!-- Optional overlay text -->
        <!-- <div class="hero-text">Wireless Energy for the Future</div> -->
    </div>

    <!-- Scrollable content below -->
    <div class="content">
        <h2>Our Projects</h2>
        <p>This section is scrollable. You can add more content below the SVG hero section.</p>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus et ultricies odio.</p>
        <p>Add additional sections, text, images, or links as needed.</p>
        <p>Keep scrolling to see more content.</p>
    </div>

</body>
</html>
